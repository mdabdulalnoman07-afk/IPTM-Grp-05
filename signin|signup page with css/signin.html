<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0d0d0d;
        --paper: #f5f0e8;
        --warm: #c8a96e;
        --muted: #6b6560;
        --border: #d6cfc4;
        --radius: 4px;
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      }

      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      body {
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        background-color: var(--paper);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.5;
      }

      .container {
        width: 100%;
        max-width: 400px;
        animation: slideUp 0.5s ease-out;
      }

      .heading-group {
        margin-bottom: 2.5rem;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--warm);
        margin-bottom: 0.5rem;
        display: block;
      }

      h2 {
        font-family: "DM Serif Display", serif;
        font-size: 2.2rem;
        line-height: 1.1;
      }

      .field {
        margin-bottom: 1.25rem;
      }

      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 1rem;
        background: #fff;
        transition: var(--transition);
        outline: none;
      }

      input:focus {
        border-color: var(--warm);
        box-shadow: 0 0 0 3px rgba(200, 169, 110, 0.15);
      }

      input:not(:placeholder-shown):invalid {
        border-color: #e67e73;
      }

      .btn-primary {
        width: 100%;
        padding: 0.9rem;
        background: var(--ink);
        color: var(--paper);
        border: none;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 0.5rem;
      }

      .btn-primary:hover {
        background: #222;
        transform: translateY(-1px);
      }

      .btn-social {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 0.8rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: #fff;
        font-size: 0.9rem;
        cursor: pointer;
        margin-bottom: 0.8rem;
        transition: var(--transition);
      }

      .btn-social:hover {
        border-color: var(--warm);
        background: rgba(200, 169, 110, 0.05);
      }

      .btn-social svg {
        width: 20px;
        height: 20px;
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        flex: 1;
        background: var(--border);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 1.25rem 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .checkbox-group input {
        accent-color: var(--warm);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .footer-link {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .footer-link a {
        color: var(--ink);
        font-weight: 500;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="heading-group">
        <span class="eyebrow">Welcome back</span>
        <h2>Sign in</h2>
      </div>
      <form>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder=" " autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">
            Password
            <a href="#" style="color: var(--ink); font-size: 0.75rem">Forgot?</a>
          </label>
          <input type="password" id="password" placeholder=" " autocomplete="current-password" required />
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="remember" />
          <label for="remember" style="cursor: pointer;">Remember me</label>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
        <div class="divider">or continue with</div>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073c0 6.019 4.388 10.997 10.125 11.927v-8.437H7.078v-3.49h3.047V9.413c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953h-1.514c-1.492 0-1.956.926-1.956 1.874v2.248h3.328l-.532 3.49h-2.796V24C19.612 23.07 24 18.092 24 12.073z"/></svg>
          Facebook
        </button>
      </form>
      <p class="footer-link">
        New here? <a href="signup.html">Create an account</a>
      </p>
    </div>
  </body>
</html>
